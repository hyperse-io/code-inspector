name: CI-integrity

on:
  push:
    branches:
      - main
      - major
      - minor
    # Only consider those paths to trigger the action
    paths:
      - 'packages/**'
      - 'package.json'
      - '*.lock'
      - '.yarnrc.yml'
      - 'tsconfig.base.json'
      - '.prettier*'
      - '.github/**'

  pull_request:
    branches:
      - main
      - major
      - minor
    types:
      - opened
      - synchronize
      - reopened
    # Only consider those paths to trigger the action
    paths:
      - 'packages/**'
      - 'package.json'
      - '*.lock'
      - '.yarnrc.yml'
      - 'tsconfig.base.json'
      - '.prettier*'
      - '.github/**'

jobs:
  test:
    if: ${{ !startsWith(github.head_ref, 'changeset-release/') }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: 📥 Monorepo install
        uses: ./.github/actions/yarn-nm-install

      - name: Check for duplicate dependencies in lock file
        run: |
          yarn dedupe --check

      - name: Check for yarn constraints.pro
        run: |
          yarn constraints

      - name: Linter
        run: |
          yarn g:lint

      # `yarn g:build-local` is deliberately not run in this job.
      #
      # Unlike the wizard monorepo, the build graph here reaches
      # `crates/inspector-swc-plugin`: `@hyperse/next-inspector` and both the
      # rspack/webpack examples depend on it, and the examples consume its wasm
      # artifact via `builtin:swc-loader`. Building therefore needs a Rust
      # toolchain plus the wasm32-wasip1 target, which this integrity job does
      # not set up.
      #
      # That build is covered by `CI-inspector-swc-plugin` (which installs Rust)
      # and by `gh-pages`, which now also sets up Rust before building.

      # https://github.com/sverweij/dependency-cruiser
      # - name: Check monorepo dependency graph
      #   run: |
      #     yarn check:install
