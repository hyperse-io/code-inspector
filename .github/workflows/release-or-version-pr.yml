name: ReleaseOrVersionPR

on:
  push:
    branches:
      - main
      
jobs:
  release:
    # Basic security: the release job can only be executed from this repo and from the main branch (not a remote thing)
    if: ${{ github.repository == 'hyperse-io/code-inspector' && contains('refs/heads/main',github.ref) && !startsWith(github.head_ref, 'changeset-release/') }}
    name: Release and changelog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5
        with:
          # To run comparison we need more than the latest commit.
          # @link https://github.com/actions/checkout#fetch-all-history-for-all-tags-and-branches
          fetch-depth: 0

      - name: 📥 Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 📥 Add wasm32-wasip1 target
        run: rustup target add wasm32-wasip1

      - name: 📥 Verify Rust toolchain  
        run: |
          rustup show
          rustup toolchain list
          rustc --version
          cargo --version

      - name: 📥 Pin default Rust toolchain
        # `dtolnay/rust-toolchain` installs the toolchain but does not always
        # register it as the default. `yarn g:release` (via `g:build`) compiles
        # `crates/inspector-swc-plugin` with cargo, so a default must exist or
        # the publish step fails with "no default is configured".
        run: rustup default stable

      - name: Use Node.js 24.x
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          package-manager-cache: false

      - name: 📥 Monorepo install
        uses: ./.github/actions/yarn-nm-install

      - name: Build inspector-swc-plugin
        working-directory: crates/inspector-swc-plugin
        run: |
          yarn clean
          yarn build

      # @link https://github.com/changesets/action (v2 for @changesets/cli v3)
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v2
        with:
          publish-script: yarn g:release
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-title: '[Release] Version packages'
          commit-message: 'Version Packages [skip ci]'
          # Optional, might be used in conjunction with GITHUB_TOKEN to
          # allow running the workflows on a Version package action.
          # Be aware of security implications.
          # setupGitUser: true
        env:
          # See https://github.com/changesets/action/issues/147
          HOME: ${{ github.workspace }}
          # `HOME` is overridden above, but rustup resolves its toolchains and
          # settings relative to `RUSTUP_HOME` (defaulting to `$HOME/.rustup`).
          # Without pinning it, `cargo` installed by dtolnay/rust-toolchain into
          # `/home/runner/.rustup` becomes invisible here. `g:release` still
          # recompiles the swc crate (it is in the workspace build graph), which
          # then failed with:
          #   rustup could not choose a version of cargo to run, because one
          #   wasn't specified explicitly, and no default is configured
          RUSTUP_HOME: /home/runner/.rustup
          CARGO_HOME: /home/runner/.cargo
          # Allows to download / query / comment packages
          # Allows to publish packages
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Support cargo
          CARGO_TERM_COLOR: always
